<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebZoeker</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #4285f4;
      --primary-dark: #3367d6;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 24px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.5px;
    }

    .container {
      width: min(860px, calc(100% - 32px));
      margin: 50px auto 40px;
      text-align: center;
    }

    .intro {
      margin: 0 0 14px;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 600;
    }

    .search-wrap {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .search-box {
      flex: 1;
      max-width: 620px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 18px 22px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      font-size: 1.05rem;
      outline: none;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.12);
    }

    .search-button {
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      padding: 17px 26px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .search-button:hover {
      background: var(--primary-dark);
    }

    .search-button:active {
      transform: translateY(1px);
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .quick-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 999px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.98rem;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .quick-links a:hover {
      background: #f3f4f6;
      transform: translateY(-1px);
    }

    .result-card {
      margin-top: 40px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
      text-align: left;
    }

    .result-card h2 {
      margin: 0 0 12px;
      font-size: 1.8rem;
    }

    .result-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .site-link {
      display: block;
      text-decoration: none;
      color: var(--text);
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 12px;
      transition: background 0.2s ease;
    }

    .site-link:hover {
      background: #f9fafb;
    }

    .site-link strong {
      color: var(--primary);
      font-size: 1.05rem;
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
      font-size: 0.95rem;
      text-align: left;
    }

    .recent-searches {
      margin-top: 20px;
      text-align: left;
    }

    .recent-searches h3 {
      font-size: 1rem;
      margin: 0 0 10px;
      color: var(--muted);
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recent-item {
      background: #eef4ff;
      color: #1d4ed8;
      border: 1px solid #cfe1ff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .search-wrap {
        flex-direction: column;
      }

      .search-box,
      .search-button {
        width: 100%;
      }

      .search-button {
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🌐 WebZoeker</h1>
  </header>

  <main class="container">
    <h2 class="intro">Zoek op internet</h2>

    <form class="search-wrap" id="zoekForm" action="#" method="get">
      <div class="search-box">
        <input
          id="zoekveld"
          type="text"
          name="q"
          placeholder="Typ wat je zoekt..."
          autocomplete="off"
          required
        />
      </div>
      <button type="submit" class="search-button">🔎 Zoeken</button>
    </form>

    <div id="foutmelding" class="error">Voer eerst een zoekterm in.</div>

    <nav class="quick-links" aria-label="Snelle zoekopties">
      <a href="#" data-type="google">🌐 Websites</a>
      <a href="#" data-type="images">🖼️ Afbeeldingen</a>
      <a href="#" data-type="youtube">▶️ Video's</a>
    </nav>

    <section class="result-card">
      <h2>Websites openen</h2>
      <p>
        Voer hierboven een zoekterm in. De resultaten openen in een nieuw tabblad.
      </p>

      <a class="site-link" href="https://www.google.com" target="_blank" rel="noopener noreferrer">
        <strong>Google</strong><br />
        Zoek op internet
      </a>

      <a class="site-link" href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">
        <strong>Wikipedia</strong><br />
        Zoek in Wikipedia
      </a>

      <a class="site-link" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
        <strong>YouTube</strong><br />
        Zoek video's
      </a>

      <div class="recent-searches" aria-live="polite">
        <h3>Recente zoekopdrachten</h3>
        <div class="recent-list" id="recentList"></div>
      </div>
    </section>
  </main>

  <script>
    const searchInput = document.getElementById('zoekveld');
    const form = document.getElementById('zoekForm');
    const errorBox = document.getElementById('foutmelding');
    const recentList = document.getElementById('recentList');

    function getSearchTerm() {
      return searchInput.value.trim();
    }

    function saveRecentSearch(term) {
      const key = 'webzoeker_recent';
      let searches = JSON.parse(localStorage.getItem(key) || '[]');

      const cleaned = searches.filter(item => item.toLowerCase() !== term.toLowerCase());
      cleaned.unshift(term);

      const limited = cleaned.slice(0, 6);
      localStorage.setItem(key, JSON.stringify(limited));
      renderRecentSearches();
    }

    function renderRecentSearches() {
      const searches = JSON.parse(localStorage.getItem('webzoeker_recent') || '[]');

      if (!searches.length) {
        recentList.innerHTML = '<span style="color:#6b7280; font-size:0.9rem;">Nog geen zoekopdrachten.</span>';
        return;
      }

      recentList.innerHTML = searches
        .map(
          term =>
            '<button class="recent-item" type="button" data-term="' + term + '">' + term + '</button>'
        )
        .join('');

      recentList.querySelectorAll('.recent-item').forEach(button => {
        button.addEventListener('click', () => {
          const term = button.dataset.term;
          searchInput.value = term;
          openSearch('google');
        });
      });
    }

    function openSearch(type) {
      const term = getSearchTerm();

      if (!term) {
        errorBox.style.display = 'block';
        return;
      }

      errorBox.style.display = 'none';
      saveRecentSearch(term);

      let url = '';

      if (type === 'google') {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(term);
      } else if (type === 'images') {
        url = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(term);
      } else if (type === 'youtube') {
        url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(term);
      }

      if (url) {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      openSearch('google');
    });

    document.querySelectorAll('[data-type]').forEach(link => {
      link.addEventListener('click', function (event) {
        event.preventDefault();
        const type = this.dataset.type;
        openSearch(type);
      });
    });

    renderRecentSearches();
  </script>
</body>
</html>
